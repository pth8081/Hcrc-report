<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HCRC</title>
    <style>
      :root {
        --ink: #1a2430;
        --ink-soft: #5a6672;
        --line: #d9dee2;
        --bg: #f4f6f7;
        --surface: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .portal { text-align: center; max-width: 640px; padding: 24px; }
      h1 { font-size: 28px; margin: 0 0 6px; }
      p { color: var(--ink-soft); margin: 0 0 32px; font-size: 15px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
      .card {
        display: flex; flex-direction: column; gap: 6px;
        padding: 20px 16px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--surface); text-decoration: none; color: var(--ink);
        transition: border-color .15s, transform .15s;
      }
      .card:hover { border-color: var(--ink); transform: translateY(-2px); }
      .card-title { font-size: 16px; font-weight: 600; }
      .card-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
      .card-audience {
        font-size: 11px; color: var(--ink-soft); margin-top: 4px;
        text-transform: uppercase; letter-spacing: .03em;
      }
      @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="portal">
      <h1>HCRC</h1>
      <p>Chọn hệ thống cần đăng nhập</p>
      <div class="cards" id="cards"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
