# deploy/nginx.conf — Mẫu cấu hình Nginx THẬT cho mô hình triển khai: cả 3
# hệ thống (etl/, rp-server/, api-server/ — chạy bằng PM2, xem
# deploy/ecosystem.config.js) + 3 giao diện tĩnh (rp-user/, api-admin/,
# etl-admin/ — build sẵn bằng `npm run build`, phục vụ TĨNH bởi chính
# Nginx, không phải tiến trình Node riêng) trên CÙNG MỘT máy chủ. CSDL
# (SQL Server) chạy trên MÁY CHỦ KHÁC — không có gì trong Nginx cần biết về
# việc đó, mỗi service tự kết nối DB qua `.env` (DWH_SERVER/RP_SERVER/
# ADMIN_SERVER/…, xem README từng service) trỏ sang IP/hostname máy chủ DB.
#
# Mỗi domain có access_log RIÊNG (hcrc-report/hcrc-api/hcrc-api-admin/
# hcrc-etl-admin.access.log) — deploy/fail2ban/ đọc đúng các file này để
# chặn brute-force đăng nhập/dò API key ở tầng firewall (bổ sung, không
# thay thế rate-limit đã có trong code — xem deploy/fail2ban/README.md).
#
# ĐỪNG copy đè lên /etc/nginx/nginx.conf gốc của hệ điều hành (đã có sẵn
# events{}/http{} + cấu hình mặc định) — file này chỉ chứa các "server {}"
# (virtual host), đặt vào:
#   /etc/nginx/conf.d/hcrc.conf              (Debian/Ubuntu/RHEL, thường có
#                                              sẵn "include /etc/nginx/conf.d/*.conf;"
#                                              trong nginx.conf gốc)
# hoặc /etc/nginx/sites-available/hcrc + symlink sang sites-enabled/ (kiểu
# Debian/Ubuntu cũ).
#
# ===== Sơ đồ 4 domain (DNS trỏ cả 4 subdomain về CÙNG 1 IP máy chủ chạy
#        Nginx này — TLS riêng từng domain, hoặc 1 chứng chỉ wildcard
#        *.hcrc.vidu.vn dùng chung cho cả 4) =====
# KHÔNG có domain "cổng vào chung" (portal) nữa — mỗi ứng dụng truy cập
# thẳng qua domain riêng, tự quản lý kết nối/quyền truy cập theo nhu cầu
# bảo mật riêng, không phụ thuộc 1 điểm liệt kê chung.
#   report.hcrc.vidu.vn     — CÔNG KHAI. rp-user/ (giao diện xem báo cáo) +
#                              /api/* proxy sang rp-server (127.0.0.1:4001).
#   api.hcrc.vidu.vn        — CÔNG KHAI, CHỈ /api/v1/*. Đối tác ngoài gọi
#                              qua đây, proxy sang api-server
#                              (127.0.0.1:4002). KHÔNG route nào khác được
#                              lộ trên domain này (không /admin, không gì
#                              khác) — /admin/* của CÙNG api-server chỉ lộ
#                              qua domain api-admin.hcrc.vidu.vn bên dưới.
#   api-admin.hcrc.vidu.vn  — NỘI BỘ/VPN. api-admin/ (tĩnh) + /admin/* proxy
#                              sang api-server (CÙNG tiến trình phục vụ
#                              api.hcrc.vidu.vn ở trên, khác domain/route).
#   etl-admin.hcrc.vidu.vn  — NỘI BỘ/VPN. etl-admin/ (tĩnh) + /admin/* proxy
#                              sang etl (127.0.0.1:4003) — etl KHÔNG có
#                              route công khai nào, toàn bộ chỉ ở đây.
#
# 2 domain "NỘI BỘ/VPN" chặn bằng `allow`/`deny` theo dải IP NGAY Ở TẦNG
# NGINX — lớp phòng thủ ĐẦU TIÊN, độc lập với ADMIN_ALLOWED_IPS ở tầng ứng
# dụng (2 lớp khác nhau, không thay được nhau — xem README từng service mục
# "Triển khai sau Nginx"). Dùng domain riêng (thay vì gộp path chung 1
# domain với report/api) để KHÔNG cần đổi cấu hình build (`base` path) của
# 2 giao diện admin — mỗi giao diện build & phục vụ ở gốc domain của nó,
# giống hệt lúc chạy `npm run dev` (chỉ khác domain thay vì localhost:517x).
#
# Nếu không tạo được 4 subdomain thật (vd chỉ có 1 domain) — xem ghi chú
# "PHƯƠNG ÁN 1 DOMAIN" ở cuối file.
#
# ===== TRUST_PROXY_HOPS =====
# Toàn bộ sơ đồ dưới đây là ĐÚNG 1 lớp Nginx duy nhất đứng trước mỗi service
# (dù phục vụ nhiều domain, vẫn là 1 tiến trình Nginx, 1 hop) — giữ nguyên
# TRUST_PROXY_HOPS=1 mặc định trong .env của cả 3 service. Nếu sau này thêm
# CDN/load balancer khác đứng TRƯỚC Nginx này nữa, phải tăng số này lên đúng
# tổng số lớp proxy.


# ===== Upstream 3 tiến trình Node (PM2, xem deploy/ecosystem.config.js) =====
upstream hcrc_rp_server  { server 127.0.0.1:4001; keepalive 32; }
upstream hcrc_api_server { server 127.0.0.1:4002; keepalive 32; }
upstream hcrc_etl_server { server 127.0.0.1:4003; keepalive 32; }


# ===== Chuyển hướng HTTP -> HTTPS cho cả 4 domain =====
server {
    listen 80;
    listen [::]:80;
    server_name report.hcrc.vidu.vn api.hcrc.vidu.vn
                api-admin.hcrc.vidu.vn etl-admin.hcrc.vidu.vn;
    return 301 https://$host$request_uri;
}


# =====================================================================
# report.hcrc.vidu.vn — CÔNG KHAI: rp-user/ (tĩnh) + /api/* -> rp-server
# =====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name report.hcrc.vidu.vn;

    # Đổi 2 đường dẫn này theo chứng chỉ thật (vd Let's Encrypt/certbot).
    ssl_certificate     /etc/letsencrypt/live/report.hcrc.vidu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.hcrc.vidu.vn/privkey.pem;

    # Log RIÊNG theo domain (không dùng chung access.log mặc định của cả 4
    # domain) — để fail2ban (xem deploy/fail2ban/) theo dõi đúng domain này,
    # không lẫn với log của domain khác.
    access_log /var/log/nginx/hcrc-report.access.log;

    # 20MB — khớp đúng multer limits.fileSize ở rp-server/routes/reportCatalog.js
    # (upload file mẫu Excel/PowerPoint cho báo cáo) — thấp hơn số này Nginx
    # tự trả 413 TRƯỚC KHI request chạm tới app, dù app cho phép.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://hcrc_rp_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Khớp/lớn hơn 1 chút server.requestTimeout (60s) đặt trong
        # rp-server/server.js — Nginx không nên cắt kết nối SỚM HƠN app.
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # rp-user/ build tĩnh (npm run build -> dist/) — SPA, mọi đường dẫn
    # không khớp /api/ đều trả về index.html, để React Router tự xử lý phía
    # client (vd F5 ở "/reports/abc" vẫn phải ra đúng trang, không phải 404
    # từ Nginx vì không có file vật lý "reports/abc").
    root /var/www/hcrc/rp-user;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}


# =====================================================================
# api.hcrc.vidu.vn — CÔNG KHAI, CHỈ /api/v1/* -> api-server. KHÔNG có route
# nào khác trên domain này — /admin/* của api-server KHÔNG được proxy ở
# đây (xem domain api-admin.hcrc.vidu.vn bên dưới, có allow/deny riêng).
# =====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hcrc.vidu.vn;

    ssl_certificate     /etc/letsencrypt/live/api.hcrc.vidu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hcrc.vidu.vn/privkey.pem;

    # Log riêng — xem chú thích cùng dòng ở domain report.hcrc.vidu.vn.
    access_log /var/log/nginx/hcrc-api.access.log;

    # 1MB đủ cho JSON body /api/v1/oauth/token — khớp express.json({limit:'1mb'})
    # trong api-server/server.js. Đối tác không upload file qua domain này.
    client_max_body_size 2m;

    location /api/v1/ {
        proxy_pass http://hcrc_api_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    # Bất kỳ đường dẫn nào khác (kể cả /admin/*) trên domain CÔNG KHAI này
    # đều KHÔNG proxy đi đâu cả — trả 404 thẳng tại Nginx, không chạm tới
    # api-server. /admin/* chỉ phục vụ qua domain api-admin.hcrc.vidu.vn.
    location / {
        return 404;
    }
}


# =====================================================================
# api-admin.hcrc.vidu.vn — NỘI BỘ/VPN. api-admin/ (tĩnh) + /admin/* ->
# api-server (CÙNG tiến trình phục vụ api.hcrc.vidu.vn, khác domain/route).
# allow/deny CHẶN Ở TẦNG NGINX TRƯỚC — đổi dải IP dưới đây thành IP văn
# phòng/VPN thật của bạn. Đây là lớp phòng thủ ĐẦU (request lạ bị Nginx từ
# chối thẳng, không chạm tới ứng dụng) — ADMIN_ALLOWED_IPS trong .env của
# api-server vẫn nên giữ (lớp phòng thủ THỨ HAI, phòng khi cấu hình Nginx
# sai/bị bỏ qua).
# =====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-admin.hcrc.vidu.vn;

    ssl_certificate     /etc/letsencrypt/live/api-admin.hcrc.vidu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-admin.hcrc.vidu.vn/privkey.pem;

    # Log riêng — xem chú thích cùng dòng ở domain report.hcrc.vidu.vn.
    access_log /var/log/nginx/hcrc-api-admin.access.log;

    # ĐỔI thành dải IP văn phòng/VPN thật — vd:
    #   allow 10.20.0.0/16;      # mạng VPN nội bộ
    #   allow 203.0.113.4;       # IP văn phòng cố định
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    client_max_body_size 5m;

    location /admin/ {
        proxy_pass http://hcrc_api_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    root /var/www/hcrc/api-admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}


# =====================================================================
# etl-admin.hcrc.vidu.vn — NỘI BỘ/VPN. etl-admin/ (tĩnh) + /admin/* -> etl
# (127.0.0.1:4003). etl KHÔNG có route công khai nào — toàn bộ chỉ ở đây.
# allow/deny giống hệt api-admin.hcrc.vidu.vn ở trên.
# =====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etl-admin.hcrc.vidu.vn;

    ssl_certificate     /etc/letsencrypt/live/etl-admin.hcrc.vidu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etl-admin.hcrc.vidu.vn/privkey.pem;

    # Log riêng — xem chú thích cùng dòng ở domain report.hcrc.vidu.vn.
    access_log /var/log/nginx/hcrc-etl-admin.access.log;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    client_max_body_size 5m;

    location /admin/ {
        proxy_pass http://hcrc_etl_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    root /var/www/hcrc/etl-admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}


# ===== PHƯƠNG ÁN 1 DOMAIN (không tạo được subdomain) =====
# Gộp cả 4 vào 1 server{} theo path thay vì domain: report ở "/", api ở
# "/papi/v1/" (đổi tiền tố tuỳ ý, cần rewrite bỏ tiền tố trước khi proxy),
# admin ở "/api-admin/" và "/etl-admin/" (allow/deny NHƯ TRÊN, khai NGAY
# TRONG location đó — Nginx cho phép allow/deny theo từng location, không
# bắt buộc theo server_name riêng). Phức tạp hơn cách 4 domain (phải build
# lại rp-user/api-admin/etl-admin với `vite build --base=/tien-to/` để asset
# JS/CSS tự trỏ đúng, và rewrite path trước khi proxy) — chỉ dùng khi thật
# sự không xin được subdomain. Không viết sẵn ở đây vì cấu hình `base` phụ
# thuộc domain/tiền tố thật của bạn.
