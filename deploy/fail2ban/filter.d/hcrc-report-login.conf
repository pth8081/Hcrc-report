# deploy/fail2ban/filter.d/hcrc-report-login.conf — Khớp lượt đăng nhập THẤT
# BẠI (401) vào POST /api/auth/login của rp-server (report.hcrc.vidu.vn) —
# xem rp-server/server.js: đăng nhập sai trả 401, KHÔNG khớp 429 (đã bị
# rate-limit ở tầng ứng dụng, không cần fail2ban lặp lại).
#
# Dòng log mẫu (Nginx access_log format 'combined' mặc định):
#   1.2.3.4 - - [30/Aug/2026:10:00:00 +0700] "POST /api/auth/login HTTP/1.1" 401 58 "-" "Mozilla/5.0"
[Definition]
failregex = ^<HOST> -.*"POST /api/auth/login HTTP/\d\.\d+" 401
ignoreregex =
