# deploy/fail2ban/filter.d/hcrc-api-abuse.conf — Khớp lượt gọi /api/v1/* (đối
# tác ngoài — api.hcrc.vidu.vn) bị TỪ CHỐI vì thiếu/sai xác thực (401 — API
# key/HMAC/OAuth2 token sai) HOẶC bị chặn tần suất (429 — đã vượt
# RateLimitPerMinute riêng của đối tác đó hoặc giới hạn chung theo IP, xem
# api-server/lib/consumerRateLimit.js). Ngưỡng maxretry ở jail.local đặt CAO
# hơn 2 filter đăng nhập ở trên — đây là domain đối tác gọi máy-tới-máy,
# vài lần 401 lẻ tẻ do bug phía đối tác là bình thường, không nên chặn IP
# quá sớm.
#
# Dòng log mẫu (Nginx access_log format 'combined' mặc định):
#   1.2.3.4 - - [30/Aug/2026:10:00:00 +0700] "GET /api/v1/reports/abc/run HTTP/1.1" 401 58 "-" "curl/8.0"
[Definition]
failregex = ^<HOST> -.*"(GET|POST|PUT|DELETE) /api/v1/\S* HTTP/\d\.\d+" (401|429)
ignoreregex =
