# deploy/fail2ban/filter.d/hcrc-admin-login.conf — Khớp lượt đăng nhập THẤT
# BẠI (401) vào POST /admin/auth/login — dùng CHUNG cho cả api-admin và
# etl-admin (2 service đều expose đúng route này, xem
# etl/routes/admin/auth.js + api-server/routes/admin/auth.js: đăng nhập sai
# trả 401, đăng nhập bị chặn do rate-limit ở tầng ứng dụng trả 429 — KHÔNG
# khớp 429 ở đây, vì đó là app đã tự chặn rồi, không cần fail2ban lặp lại).
#
# Dòng log mẫu (Nginx access_log format 'combined' mặc định):
#   1.2.3.4 - - [30/Aug/2026:10:00:00 +0700] "POST /admin/auth/login HTTP/1.1" 401 58 "-" "Mozilla/5.0"
[Definition]
failregex = ^<HOST> -.*"POST /admin/auth/login HTTP/\d\.\d+" 401
ignoreregex =
